name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  release-verification:
    name: Release Verification
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build

      - name: Run smoke and registry verification
        run: |
          python -m pytest -q tests/smoke tests/registry

      - name: Verify generated docs are up to date
        run: |
          python scripts/sync_docs_from_registry.py --check

      - name: Verify generated command registry artifact is up to date
        run: |
          python scripts/generate_command_registry_artifact.py --check

      - name: Run Ruff lint
        run: |
          python -m ruff check unrealmate tests

  pypi-publish:
    name: Upload release to PyPI
    needs: release-verification
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
