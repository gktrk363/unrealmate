version = "1.0.0"

[performance]
cache_enabled = true
cache_ttl_hours = 12
max_cache_size_mb = 50
parallel_processing = false
max_workers = 2

[signature]
show_banner = true
compact_banner = false
show_footer = true
color_theme = "cyan_magenta"

[git]
auto_lfs = true
commit_template_enabled = true
pre_commit_hooks = true
