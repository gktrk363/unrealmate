# Template: AAA Game
# Optimized for large-scale AAA game development

version = "1.0.0"

[performance]
cache_enabled = true
cache_ttl_hours = 72
max_cache_size_mb = 500
parallel_processing = true
max_workers = 8

[signature]
show_banner = true
compact_banner = false
show_footer = true
color_theme = "cyan_magenta"

[git]
auto_lfs = true
commit_template_enabled = true
pre_commit_hooks = true
